# ============================================================================
# Ontology schema — per-document regulation knowledge graphs
# ============================================================================
# v0.2 (2026-10-12): generalized from UN Regulation No. 154 to any regulatory
# PDF via document-family profiles (plan.md). One graph per document; graphs
# are never combined (external documents are per-graph stub nodes).
#
# Implemented by pipeline/phase*.py, assembled by pipeline/phase5_assemble.py.
# Every node type and relationship below is POPULATED unless marked
# `status: deferred`. v0.1 (Reg 154 only) is in git history.
# ============================================================================

schema_version: "0.2.0"

# ----------------------------------------------------------------------------
# Identity / id scheme (plan.md §5.3)
# ----------------------------------------------------------------------------
qualified_id_scheme:
  pattern: "<doc_id>.<unit-path>"
  doc_id: "from documents.yaml (REG154.04, GTR22, EU2024-1257, EU2026-1762); auto-derived for unregistered PDFs"
  rules:
    - "decimal clause: <container id>.<number path>        REG154.04.ANNEX-B6.APP1.2.4"
    - "root-scoped units (Annex, Article, Recital, Chapter, Part) are NOT nested under their parent in the id: EU2024-1257.ART-4 (parent CH-II is an edge)"
    - "parent-scoped units nest: EU2026-1762.ANNEX-II.APP-2, EU2024-1257.ART-3.PT-48, REG154.04.ANNEX-A1.APP1.PART-II"
    - "transparent containers (GTR rationale sections A-F) are skipped in child ids: GTR22.RATIONALE.14 under GTR22.RATIONALE.SEC-C"
    - "tables/figures are scoped to their division (EU annexes restart numbering): EU2024-1257.ANNEX-I.TABLE-9"
    - "equations: <unit id>.EQ-<n>; variables: <doc_id>.VAR:<symbol>; terms: <doc_id>.DEF:<unit path>, <doc_id>.ABBR:<surface form>"
    - "footnotes: <doc_id>.FN-<marker>[-p<page>]"
    - "external: <doc_id>/EXT:<canonical id>[#<locator path>] - the shared EXT: suffix makes a future cross-document merge a join"
  examples:
    - "REG154.04.BODY.6.3.2"
    - "GTR22.RATIONALE.SEC-C"
    - "GTR22.BODY.6.3.3.EQ-2"
    - "EU2024-1257.RECITAL-17"
    - "EU2024-1257.ART-3.PT-48"
    - "EU2026-1762.ANNEX-II.APP-2"
    - "EU2026-1762/EXT:UNR-179#ANNEX-1.APP-2"

# ----------------------------------------------------------------------------
# Node types
# ----------------------------------------------------------------------------
node_types:

  Standard:
    represents: "The standard/regulation family the document belongs to (one per graph)."
    id: "<doc_id>.STANDARD"
    properties: [document_name, standard_number, region, regulatory_body, family]

  Document:
    represents: "The ingested PDF = one Version of the Standard (labels: Document, Version)."
    id: "<doc_id>"
    properties: [title, number, series, date, issuer, region, family, source_file, sha256, page_count, registry_confirmed]

  # --- structural units (plan §5.1) -------------------------------------------
  # Every structural node carries: qualified_id, unit_type, level (profile
  # level name or 'decimal'), parent_id, local_label, local_number, depth,
  # page, page_end, title, body_text, footnote_text, has_body, labels,
  # division, normative (false for GTR rationale / EU recitals).
  # Non-prose regions leave placeholders in body_text: [TABLE:<id>],
  # [FIGURE:<id>], [EQ:<id>].
  Clause:            { represents: "Decimal-numbered paragraph (6.3.2.) at any depth; labels Section/Subsection/Provision by depth, + Paragraph when has_body." }
  Body:              { represents: "Main text container (Reg 154 BODY; EU enacting terms after 'HAVE ADOPTED')." }
  Preamble:          { represents: "EU citations + 'Whereas:' block before the enacting terms." }
  Recital:           { represents: "EU recital (n) - non-normative." }
  FrontMatter:       { represents: "Cover / registry text before the first heading (GTR)." }
  Part:              { represents: "GTR Part I (RATIONALE, non-normative) / Part II (BODY); Reg 154 test-report 'Part I/II/III'." }
  Section:           { represents: "Lettered rationale section (GTR A.-F.) or EU 'SECTION n'." }
  Chapter:           { represents: "EU CHAPTER <roman> (container; Articles are root-scoped)." }
  Article:           { represents: "EU Article n (numbered globally)." }
  ArticleParagraph:  { represents: "Numbered paragraph '1.' scoped to its Article." }
  Point:             { represents: "Numbered point (n) of an Article (e.g. Article 3 definitions)." }
  Annex:             { represents: "Annex <A1|B6a|IV|1>." }
  Appendix:          { represents: "Appendix to the regulation or to an annex." }
  form_units:
    note: "An Annex/Appendix whose title matches the profile's form_titles (certificate, vehicle survey) gets is_form: true; its numbered fields are not parsed as clauses."

  Definition:
    id: "<doc_id>.DEF:<unit path>"
    properties: [quoted_term, gloss, abbreviation, verb, source_clause, defined_by_reference, scope_unit, normative]
  Abbreviation:
    id: "<doc_id>.ABBR:<surface_form>"
    properties: [surface_form, expansion, category, source (table|definition|inline), source_clause, occurrences]
  Footnote:
    id: "<doc_id>.FN-<marker>[-p<page>]"
    properties: [marker, text, page, unit_id]

  Table:
    represents: "Captioned (or uncaptioned ruled data) table. Caption + flattened cell text only - no structured values (non-goal)."
    properties: [caption_id, caption, defining_unit, division, pages, regions, cell_text, flow_text, caption_only]
  Figure:
    properties: [caption_id, caption, defining_unit, division, pages, regions, figure_labels]

  Equation:
    represents: "Display equation, inequality or decision rule (plan §7.1)."
    id: "<unit id>.EQ-<n>"
    properties:
      kind:          { type: enum, values: [equation, inequality, decision_rule, expression] }
      raw_text:      { type: string, note: "as extracted (math-italic Unicode kept)" }
      linear:        { type: string, note: "SOCE_measured=(UBE_measured)/(UBE_certified)*100" }
      latex:         { type: string, note: "best effort" }
      lhs:           { type: string }
      symbols:       { type: "list<string>" }
      outcome:       { type: enum, values: [pass, fail, continue], note: "decision rules" }
      parse_status:  { type: enum, values: [parsed, partial, image_only, unparsed], note: "parsed = sympy round-trips" }
      source:        { type: enum, values: [text_layer, image] }
      inline:        { type: bool }
      glossary:      { type: "list<{symbol, symbol_text, description, unit}>", note: "the 'where:' block" }
      image_path:    { type: string, note: "always written: equations/<id>.png crop of the PDF" }
      context_before: { type: string }
      condition:     { type: string }
      label:         { type: string, note: "printed equation number" }
      uses_table_caption: { type: string }
      unit_id, page, bbox: {}
  Variable:
    id: "<doc_id>.VAR:<normalised symbol>"
    properties: [symbol, display, latex, equations, descriptions]
    note: "Meanings live on DESCRIBED_AS edges - the same symbol means different things in different equations."

  ExternalDocument:
    id: "<doc_id>/EXT:<canonical>  e.g. EXT:UNR-179, EXT:UNGTR-15, EXT:EU.REG.2018-858, EXT:EC.DIR.2007-46, EXT:ISO.8178-1, EXT:TFEU"
    properties: [ext_id, doc_kind, issuer, number, year, subtype, title, adoption_date, oj_ref, eli, aliases, mention_count, first_cited_in, in_corpus, corpus_doc_id]
    doc_kind_values: [un_regulation, un_gtr, eu_regulation, ec_regulation, eu_directive, eu_decision, treaty, unece_agreement, unece_document, standard]
    note: "in_corpus/corpus_doc_id are informational only: no edge into another document's graph."
  ExternalProvision:
    id: "<doc_id>/EXT:<canonical>#<locator path>  e.g. EXT:EU.REG.2018-858#ART-3.PT-49"
    properties: [ext_id, external_doc, locator, label, raw_text, mention_count]

# ----------------------------------------------------------------------------
# Relationship types
# ----------------------------------------------------------------------------
relationship_types:
  HAS_VERSION:        { from: Standard, to: Document }
  HAS_DIVISION:       { from: Document, to: "top-level unit" }
  HAS_CHILD:          { from: unit, to: unit, notes: "recursive containment" }
  HAS_DEFINITION:     { from: unit, to: Definition }
  HAS_ABBREVIATION:   { from: unit, to: Abbreviation }
  HAS_FOOTNOTE:       { from: unit, to: Footnote }
  HAS_TABLE:          { from: unit, to: Table }
  HAS_FIGURE:         { from: unit, to: Figure }
  HAS_EQUATION:       { from: unit, to: Equation }
  DEFINES:            { from: Equation, to: Variable, notes: "left-hand side" }
  USES:               { from: Equation, to: Variable, properties: [role] }
  DESCRIBED_AS:       { from: Equation, to: Variable, properties: [description, unit] }
  DEPENDS_ON:         { from: Equation, to: Equation, notes: "an rhs symbol is another equation's lhs (same document)" }
  USES_TABLE:         { from: Equation, to: Table }
  SAME_TERM_AS:       { from: Variable, to: "Abbreviation | Definition", properties: [status: candidate, match], notes: "for human review - never asserted" }
  REFERENCES:
    from: unit
    to: [unit, Table, Figure, Equation]
    properties: [kind (paragraph|article|annex|appendix|table|figure|equation|recital|chapter), raw_text, qualifier, resolved_level]
    notes: "Resolved internal references only; unresolved ones stay in references.jsonl with raw_text - never guessed."
  HAS_PROVISION:      { from: ExternalDocument, to: ExternalProvision }
  CITES:
    from: "unit (or the unit owning a table/footnote)"
    to: [ExternalProvision, ExternalDocument]
    properties: [role, raw_text, sentence, version, via (direct|back_reference|footnote|table|title)]
    role_values: [requirement_source, definition_source, legal_basis, amends, repeals, implements, replaces, cites]
  AMENDS:             { from: Document, to: ExternalDocument }
  REPEALS:            { from: Document, to: ExternalDocument }
  IMPLEMENTS:         { from: Document, to: ExternalDocument }
  LEGAL_BASIS:        { from: Document, to: ExternalDocument }

deferred_relationship_types:
  MENTIONED_IN: { status: deferred, notes: "term-usage scanning; the explorer/app compute abbreviation mentions at query time" }
  SAME_AS:      { status: deferred, notes: "Abbreviation <-> Definition reconciliation; SAME_TERM_AS candidates exist for variables" }
  SUPERSEDES:   { status: deferred, notes: "cross-document version chains - needs graph combination, out of scope" }
  LAST_AMENDED_IN: { status: deferred, notes: "no tracked-changes markup in any corpus PDF" }
  HAS_ATTRIBUTE / HAS_CONSTRAINT: { status: deferred, notes: "Attributes/Constraints (numeric limits) - table values are a non-goal for v1" }

# ----------------------------------------------------------------------------
# Decisions
# ----------------------------------------------------------------------------
confirmed_decisions:
  - id: term-model-deferral
    decision: "Abbreviation and Definition stay separate node types; no merge, no MENTIONED_IN/SAME_AS (v1, kept in v0.2)."
  - id: references-vs-citations
    decision: "One REFERENCES type for internal references. External citations are CITES (plan §9a) - a different target class, not a second name for the same thing."
  - id: tracked-changes-and-footnotes
    decision: "status/superseded_text not populated (no markup in any corpus PDF). Footnotes are Footnote nodes (HAS_FOOTNOTE) and also concatenated into footnote_text for convenience."
  - id: graph-store-choice
    decision: "NetworkX/JSON (+ GraphML, pickle). No Neo4j server."
  - id: one-graph-per-document
    decision: "2026-10-12: graphs are never combined; every external document is a per-graph node even when it is also in Document/ (in_corpus is informational)."
  - id: all-external-kinds
    decision: "2026-10-12: every external document kind is recorded (regulations, directives, decisions, GTRs, standards, UNECE documents, agreements, treaties)."
  - id: plan-13-defaults
    decision: "2026-10-12, plan.md §13 defaults taken: no math OCR (image-only equations = crop + glossary); REG154.04 id kept; only numbered EU points become nodes (lettered stay inline); GTR rationale included as non-normative; pyyaml + sympy added; Table cell_text stored; standard ids keep part, year goes on the citation edge's version."
  - id: eu-act-ids
    decision: "EU acts are identified by org + type + number as printed; implementing/delegated regulations fold into REG with `subtype` (EXT:EU.REG.2026-1762, subtype implementing) so a bare 'Regulation (EU) 2020/683' citation and 'Commission Implementing Regulation (EU) 2020/683' are one node."

open_decisions:
  - id: prior-version-ingestion
    confirm: "Whether to ingest earlier series (Reg 154 03 series) - needs cross-document graphs, out of scope now."
