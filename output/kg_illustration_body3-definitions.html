<title>§3 — Definitions For the purposes of this Regulation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --bg:#f4f6f8;
    --surface:#ffffff;
    --surface-2:#eef1f4;
    --border:#d8dee4;
    --text:#182430;
    --text-dim:#5b6b7a;
    --text-faint:#8a97a3;
    --accent:#2f6fb2;
    --accent-soft:#8fb8dd;
    --accent-wash:#e4edf6;
    --ref:#b9791f;
    --edge:#9aa4ad;
    --edge-ref:#c99a4c;
    --focus:#d1491f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10161d;
      --surface:#181f27;
      --surface-2:#1f2831;
      --border:#2c3742;
      --text:#e7edf3;
      --text-dim:#96a5b3;
      --text-faint:#697782;
      --accent:#5b9bd9;
      --accent-soft:#3c5b78;
      --accent-wash:#1c2b38;
      --ref:#d9a44f;
      --edge:#47535f;
      --edge-ref:#7a6237;
      --focus:#e8703f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10161d;
    --surface:#181f27;
    --surface-2:#1f2831;
    --border:#2c3742;
    --text:#e7edf3;
    --text-dim:#96a5b3;
    --text-faint:#697782;
    --accent:#5b9bd9;
    --accent-soft:#3c5b78;
    --accent-wash:#1c2b38;
    --ref:#d9a44f;
    --edge:#47535f;
    --edge-ref:#7a6237;
    --focus:#e8703f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:11px 18px;
    border-bottom:1px solid var(--border);
    background:var(--surface);
    flex:0 0 auto;
    z-index:5;
  }
  .brand{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    min-width:0;
  }
  .brand .doc{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--text-faint);
    text-transform:uppercase;
  }
  .brand .title{
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
  }
  .searchwrap{
    position:relative;
    flex:0 1 300px;
  }
  .searchwrap input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:7px 10px 7px 30px;
    font-family:"IBM Plex Sans",sans-serif;
    font-size:13px;
    color:var(--text);
  }
  .searchwrap input:focus{
    outline:2px solid var(--accent);
    outline-offset:-1px;
  }
  .searchwrap svg{
    position:absolute;
    left:9px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    stroke:var(--text-faint);
    pointer-events:none;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:12px;
    color:var(--text-dim);
    flex:0 0 auto;
    white-space:nowrap;
  }
  .legend .item{display:flex;align-items:center;gap:6px;}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
  .legend .ln{width:18px;height:0;border-top:2px solid var(--edge);flex:0 0 auto;}
  .legend .ln.ref{border-top:2px dashed var(--edge-ref);}
  .spacer{flex:1 1 auto;}
  .stats{
    font-family:"IBM Plex Mono",monospace;
    font-size:11.5px;
    color:var(--text-faint);
    flex:0 0 auto;
  }
  button.reset{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:"IBM Plex Sans",sans-serif;
    font-size:12px;
    padding:6px 11px;
    border-radius:6px;
    cursor:pointer;
    flex:0 0 auto;
  }
  button.reset:hover{color:var(--text);border-color:var(--text-faint);}
  button.reset:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  main{
    position:relative;
    flex:1 1 auto;
    min-height:0;
  }
  svg#graph{
    width:100%;
    height:100%;
    display:block;
    cursor:grab;
  }
  svg#graph:active{cursor:grabbing;}

  .node circle{
    stroke:var(--bg);
    stroke-width:1.4px;
  }
  .node text{
    font-family:"IBM Plex Sans",sans-serif;
    fill:var(--text);
    pointer-events:none;
    paint-order:stroke;
    stroke:var(--bg);
    stroke-width:3px;
    stroke-linejoin:round;
  }
  .node.dim circle{opacity:.16;}
  .node.dim text{opacity:.12;}
  .node.hover circle,.node.match circle{stroke:var(--focus);stroke-width:2.5px;}
  .node.selected circle{stroke:var(--focus);stroke-width:3px;}

  .link{fill:none;}
  .link.dim{opacity:.06;}

  #tooltip{
    position:absolute;
    pointer-events:none;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 9px;
    font-size:12px;
    color:var(--text-dim);
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    max-width:260px;
    z-index:20;
    display:none;
  }
  #tooltip .t-label{color:var(--text);font-weight:600;font-size:12.5px;}

  #panel{
    position:absolute;
    top:14px;
    right:14px;
    width:320px;
    max-height:calc(100% - 28px);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.16);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:15;
  }
  #panel.open{display:flex;}
  #panel .p-head{
    padding:13px 14px 10px;
    border-bottom:1px solid var(--border);
    flex:0 0 auto;
  }
  #panel .p-kind{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:4px;
  }
  #panel .p-title{
    font-size:15px;
    font-weight:600;
    line-height:1.3;
  }
  #panel .p-id{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    color:var(--text-faint);
    margin-top:3px;
  }
  #panel .p-close{
    position:absolute;
    top:10px;
    right:10px;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    padding:4px;
  }
  #panel .p-close:hover{color:var(--text);}
  #panel .p-body{
    padding:12px 14px 14px;
    overflow-y:auto;
    font-size:13px;
    line-height:1.55;
    color:var(--text-dim);
  }
  #panel .p-section-label{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:12px 0 6px;
  }
  #panel .p-section-label:first-child{margin-top:0;}
  #panel .chiplist{display:flex;flex-wrap:wrap;gap:6px;}
  #panel .chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:5px;
    padding:3px 8px;
    font-size:11.5px;
    color:var(--text-dim);
    cursor:pointer;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #panel .chip:hover{border-color:var(--accent);color:var(--text);}
  #panel .chip.ref{border-color:var(--edge-ref);}

  #hint{
    position:absolute;
    left:14px;
    bottom:14px;
    font-size:11.5px;
    color:var(--text-faint);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 10px;
    z-index:10;
  }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
