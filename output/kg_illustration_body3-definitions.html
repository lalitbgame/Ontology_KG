 rate of at least 1 Hz with the engine running in warm condition, the gear lev...","local":"2","labels":["Section","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B3","label":"Annex B3","core":false,"term":null,"text":"Specifications of reference fuels","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B4.2.1","label":"Annex B4 \u00a72.1","core":false,"term":null,"text":"For the purpose of this document, the terms and definitions given in paragraph 3. of this Regulation shall have primacy. Where definitions are not provided in paragraph 3. of this Regulation, definitions given in ISO 3833:1977 \"Road vehicles -- Types -- Terms and definitions\" shall apply.","local":"2.1","labels":["Subsection","Paragraph"],"degree":2},{"id":"REG154.04.ANNEX-B4.6.7.2.1","label":"Annex B4 \u00a76.7.2.1","core":false,"term":null,"text":"The aerodynamic force of each wind speed F0wind, Flow, and Fhigh shall be calculated using the equation below. FAw = (CD \u00d7 Af )w \u00d7 \u03c10 2 \u00d7 vw 2 3.62 where: (CD \u00d7 Af )j is the product of the drag coefficient and frontal area measured in the wind tunnel at a certain reference speed point j, if applicable, m\u00b2; \u03c10 is the dry air density defined in paragraph 3.2.10. of this Regulation, kg/m\u00b3; Fw is the aerodynamic force calculated at wind speed w, N; vw is the applicable wind speed, km/h. w is the reference to the applicable wind speed \"0wind\", \"low\" and \"high\"; F0wind is the aerodynamic force at...","local":"6.7.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B4.6.7.2.2","label":"Annex B4 \u00a76.7.2.2","core":false,"term":null,"text":"The aerodynamic force shall be calculated using the equation below, where the final (CD \u00d7 Af ) of that wind speed shall be used that is also used for determination of optional equipment within the interpolation method. If the vehicle is equipped with velocity-dependent movable aerodynamic body parts, the corresponding (CD \u00d7 Af) values shall be applied for the reference speed points concerned. FAj = (CD \u00d7 Af )j \u00d7 \u03c10 2 \u00d7 vj 2 3.62 where: FAj is the aerodynamic force calculated at reference speed j, N; (CD \u00d7 Af )j is the product of the drag coefficient and frontal area measured in the wind tun...","local":"6.7.2.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6","label":"Annex B6","core":false,"term":null,"text":"Type 1 test procedures and test conditions","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6.2.3.2","label":"Annex B6 \u00a72.3.2","core":false,"term":null,"text":"CO2 interpolation range","local":"2.3.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6.2.6.6.1","label":"Annex B6 \u00a72.6.6.1","core":false,"term":null,"text":"Vehicles equipped with a predominant mode shall be tested in that mode. At the request of the manufacturer, the vehicle may alternatively be tested with the driver-selectable mode in the worst-case position for CO2 emissions. The manufacturer shall provide evidence to the responsible authority of the existence of a mode that fulfils the requirements of paragraph 3.5.9. of this Regulation. With the agreement of the responsible authority, the predominant mode may be used as the only mode for the determination of criteria emissions, CO2 emissions, and fuel consumption.","local":"2.6.6.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6.APP1.1.1","label":"Annex B6 \u00a71.1","core":false,"term":null,"text":"This appendix defines the specific provisions regarding testing a vehicle equipped with periodically regenerating systems as defined in paragraph 3.8.1. of this Regulation. For Level 1A and 4-phase WLTP in Level 2 only: For the purpose of type-approval the manufacturer shall provide the granting approval authority with a signed declaration of compliance for the regeneration requirements. This declaration of compliance replaces the requirements for testing in accordance with this Appendix at type-approval. The declaration of compliance shall also include the applicable regeneration factors K...","local":"1.1","labels":["Subsection","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6a","label":"Annex B6a","core":false,"term":null,"text":"Ambient Temperature Correction Test for the determination of CO2 emissions under representative regional temperature conditions This annex is applicable to Level 1A and 4-phase WLTP in Level 2 only;","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B6a.3.4.1","label":"Annex B6a \u00a73.4.1","core":false,"term":null,"text":"Road load and dynamometer settings shall be as specified in Annex B4, including the requirement for the room temperature to be at 23 oC. To take account of the difference in air density at 14 oC when compared to the air density at 20 oC, the chassis dynamometer shall be set as specified in paragraphs 7. and 8. of Annex B4 with the exception that f2_TReg from the following equation shall be used as the target coefficient Ct. f2_TReg = f2 * (Tref + 273)/(Treg + 273) where: f2 is the second order road load coefficient, at reference conditions, N/(km/h)2; Tref is the road load reference tempera...","local":"3.4.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B7.3.2.3.2.2.1","label":"Annex B7 \u00a73.2.3.2.2.1","core":false,"term":null,"text":"Mass of an individual vehicle The test masses of vehicles H and L shall be used as input for the interpolation method. TMind, in kg, shall be the test mass of an individual vehicle according to paragraph 3.2.25. of this Regulation. If the same test mass is used for test vehicles L and H, the value of TMind shall be set to the mass of test vehicle H for the interpolation method.","local":"3.2.3.2.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B7.3.2.4.1.1.1","label":"Annex B7 \u00a73.2.4.1.1.1","core":false,"term":null,"text":"Mass of an individual vehicle The test masses of vehicles HM and LM selected according to paragraph 4.2.1.4. of Annex B4 shall be used as input. TMind, in kg, shall be the test mass of the individual vehicle according to the definition of test mass in paragraph 3.2.25. of this Regulation. If the same test mass is used for vehicles LM and HM, the value of TMind shall be set to the mass of vehicle HM for the road load matrix family method.","local":"3.2.4.1.1.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B8","label":"Annex B8","core":false,"term":null,"text":"Pure electric, hybrid electric and compressed hydrogen fuel cell hybrid vehicles","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B8.3.2.4.2.1","label":"Annex B8 \u00a73.2.4.2.1","core":false,"term":null,"text":"The test shall be carried out with a fully charged REESS according to the charging requirements as described in paragraph 2.2.3. of Appendix 4 to this annex and with the vehicle operated in charge-depleting operating condition as defined in paragraph 3.3.5. of this Regulation.","local":"3.2.4.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B8.3.2.5.2.1","label":"Annex B8 \u00a73.2.5.2.1","core":false,"term":null,"text":"Tests shall be carried out with the vehicle operated in charge-sustaining operating condition as defined in paragraph 3.3.6. of this Regulation.","local":"3.2.5.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B8.3.3.2.1","label":"Annex B8 \u00a73.3.2.1","core":false,"term":null,"text":"Vehicles shall be tested under charge-sustaining operating condition as defined in paragraph 3.3.6. of this Regulation.","local":"3.3.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-B8.3.5.2.1","label":"Annex B8 \u00a73.5.2.1","core":false,"term":null,"text":"Vehicles shall be tested under charge-sustaining operating conditions as defined in paragraph 3.3.6. of this Regulation.","local":"3.5.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-C1","label":"Annex C1","core":false,"term":null,"text":"Battery Durability This Annex applies to PEVs or OVC-HEVs which have an originally installed battery as defined in this Regulation.","local":null,"labels":["DivisionRoot","Paragraph"],"degree":7},{"id":"REG154.04.ANNEX-C1.APP2","label":"Annex C1","core":false,"term":null,"text":"Values to be read from vehicles The manufacturer shall make available the following values to be read visually or via the on- board network:","local":null,"labels":["DivisionRoot","Paragraph"],"degree":4},{"id":"REG154.04.ANNEX-C1.APP3.6.5.3","label":"Annex C1 \u00a76.5.3","core":false,"term":null,"text":"Preconditioning drive Start for: Sealed fuel tanks, stand- alone hot soak and diurnals 6 to 36 hours Preconditioning drive Preconditioning drive The vehicle shall be placed on a chassis dynamometer and driven over the following phases of the cycle described in Annex B1: (a) For Class 1 vehicles: low, medium, low, low, medium, low (b) For Class 2 and 3 vehicles: low, medium, high, medium. For OVC-HEVs, the preconditioning drive shall be performed under the charge-sustaining operating condition as defined in paragraph 3.3.6. of this Regulation. Upon the request of responsible authority, any o...","local":"6.5.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-C4.7","label":"Annex C4 \u00a77","core":false,"term":null,"text":"Measuring emissions of pollutants A first test is carried out when the vehicle has reached a mileage between 3,000 km and 5,000 km. Further tests are carried out at 20,000 km (\u00b1400 km) and then every 20,000 km (\u00b1400 km) or more frequently, at regular intervals until having covered the target useful life. Exhaust emissions are measured in accordance with the Type 1 Test as defined in paragraph 6.3. of this Regulation. At the choice of the manufacturer any of the above tests can be repeated. In such a case the average value of all the repeated tests shall be considered as a single value for t...","local":"7","labels":["Section","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-C5","label":"Annex C5","core":false,"term":null,"text":"On-Board Diagnostics (OBD) for motor vehicles","local":null,"labels":["DivisionRoot","Paragraph"],"degree":2},{"id":"REG154.04.ANNEX-C5.APP1","label":"Annex C5","core":false,"term":null,"text":"Functional aspects of On-Board Diagnostic (OBD) systems","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.ANNEX-C5.APP1.6.5.3.5","label":"Annex C5 \u00a76.5.3.5","core":false,"term":null,"text":"When a fault is registered, the manufacturer shall identify the fault using an appropriate ISO/SAE controlled fault code specified in one of the standards listed in paragraph 6.5.3.2.(d) of this appendix relating to \"emission related system diagnostic trouble codes\". If such identification is not possible, the manufacturer may use manufacturer controlled diagnostic trouble codes according to the same standard. The fault codes shall be fully accessible by standardised diagnostic equipment complying with the provisions of paragraph 6.5.3.3. of this appendix.","local":"6.5.3.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.APPENDIX-2","label":"Appendix 2","core":false,"term":null,"text":"Verification of conformity of production for Type 1 test\u2014 statistical method","local":null,"labels":["DivisionRoot","Paragraph"],"degree":1},{"id":"REG154.04.APPENDIX-5","label":"Appendix 5","core":false,"term":null,"text":"Devices for monitoring on board the vehicle the consumption of fuel and/or electric energy","local":null,"labels":["DivisionRoot","Paragraph"],"degree":4},{"id":"REG154.04.BODY.11.1.4","label":"\u00a711.1.4","core":false,"term":null,"text":"Until 31 December 2029 Contracting Parties shall not refuse to grant approvals to new types of vehicles which comply with the 04 series of amendments to this Regulation and do not comply with the following requirements:: For Level 1A and Level 2 only: a. The lifetime value retention status requirements defined in paragraphs","local":"11.1.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.11.1.5","label":"\u00a711.1.5","core":true,"term":null,"text":"This paragraph is applicable for Level 1A and Level 2 only As of 1 January 2030, Contracting Parties applying this Regulation shall not be obliged to accept type approvals for vehicles that do not comply with the provisions of paragraph 11.1.4.","local":"11.1.5","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3","label":"\u00a73","core":true,"term":null,"text":"Definitions For the purposes of this Regulation the following definitions shall apply:","local":"3","labels":["Section","Paragraph"],"degree":19},{"id":"REG154.04.BODY.3.0.1","label":"Vehicle type with regard to emi...","core":true,"term":"Vehicle type with regard to emissions","text":"a group of vehicles which: (a) Do not differ with respect to the criteria constituting an \"interpolation family\" as defined in paragraph 6.3.2.; (b) Fall in a single \"CO2 interpolation range\" within the meaning of paragraph 2.3.2. of Annex B6; (c) Do not differ with respect to any characteristics that have a non- negligible influence on tailpipe emissions, such as, but not limited to, the following: (i) Types and sequence of pollution control devices (e.g. three-way catalyst, oxidation catalyst, lean NOx trap, SCR, lean NOx catalyst, particulate trap or combinations thereof in a single unit); (ii) Exhaust gas recirculation (with or without, internal/external, cooled/non-cooled, low/high/combined pressure).","local":"3.0.1","labels":["Provision","Paragraph"],"degree":8},{"id":"REG154.04.BODY.3.0.2","label":"\u00a73.0.2","core":true,"term":null,"text":"\"Engine capacity\" means: For reciprocating piston engines, the nominal engine swept volume. For rotary piston engines (Wankel), twice the nominal swept volume of a combustion chamber per piston.","local":"3.0.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.0.3","label":"\u00a73.0.3","core":true,"term":null,"text":"\"Engine displacement\" means: For reciprocating piston engines, the nominal engine swept volume. For rotary piston engines (Wankel), the nominal swept volume of a combustion chamber per piston.","local":"3.0.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.0.4","label":"Approval of a vehicle","core":true,"term":"Approval of a vehicle","text":"the approval of a vehicle type with regard to the scope of this Regulation.","local":"3.0.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1","label":"\u00a73.1","core":true,"term":null,"text":"Test equipment , 3.2., 3.3., 3.4., 3.5. and 3.6. of Appendix 5 to this Regulation. b. For PEVs, the requirements for OBFCM devices regarding the determination, storage and making available of lifetime values for the parameters defined in paragraphs 3.3 (j) and (k) of Appendix 5 to this Regulation. c. For OVC-HEVs the requirements for OBFCM devices regarding the determination, storage and making available of lifetime values for the parameters defined in paragraphs 3.2 (p) and (q) of Appendix 5 to this Regulation. d. The accuracy requirements regarding the vehicle energy charged for OVC-HEVs ...","local":"3.1","labels":["Subsection","Paragraph"],"degree":29},{"id":"REG154.04.BODY.3.1.1","label":"Accuracy","core":true,"term":"Accuracy","text":"the difference between a measured value and a reference value, traceable to a national standard and describes the correctness of a result. See Figure 1.","local":"3.1.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.10","label":"Reference value","core":true,"term":"Reference value","text":"a value traceable to a national standard. See Figure 1.","local":"3.1.10","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.11","label":"Set point","core":true,"term":"Set point","text":"the target value a control system aims to reach.","local":"3.1.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.12","label":"Span","core":true,"term":"Span","text":"to adjust an instrument so that it gives a proper response to a calibration standard that represents between 75 per cent and 100 per cent of the maximum value in the instrument range or expected range of use.","local":"3.1.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.13","label":"Total hydrocarbons","core":true,"term":"Total hydrocarbons","text":"all volatile compounds measurable by a flame ionization detector (FID).","local":"3.1.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.14","label":"Verification","core":true,"term":"Verification","text":"to evaluate whether or not a measurement system's outputs agrees with applied reference signals within one or more predetermined thresholds for acceptance.","local":"3.1.14","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.15","label":"Zero gas","core":true,"term":"Zero gas","text":"a gas containing no analyte which is used to set a zero response on an analyser.","local":"3.1.15","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.16","label":"Response time","core":true,"term":"Response time","text":"the difference in time between the change of the component to be measured at the reference point and a system response of 90 per cent of the final reading (t90) with the sampling probe being defined as the reference point, whereby the change of the measured component is at least 60 per cent full scale (FS) and takes place in less than 0.1 second. The system response time consists of the delay time to the system and of the rise time of the system.","local":"3.1.16","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.17","label":"Delay time","core":true,"term":"Delay time","text":"the difference in time between the change of the component to be measured at the reference point and a system response of 10 per cent of the final reading (t10) with the sampling probe being defined as the reference point. For gaseous components, this is the transport time of the measured component from the sampling probe to the detector.","local":"3.1.17","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.18","label":"Rise time","core":true,"term":"Rise time","text":"the difference in time between the 10 per cent and 90 per cent response of the final reading (t90 \u2013 t10). Figure 1 Definition of accuracy, precision and reference value","local":"3.1.18","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.2","label":"Calibration","core":true,"term":"Calibration","text":"the process of setting a measurement system's response so that its output agrees with a range of reference signals.","local":"3.1.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.3","label":"Calibration gas","core":true,"term":"Calibration gas","text":"a gas mixture used to calibrate gas analysers.","local":"3.1.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.4","label":"Double dilution method","core":true,"term":"Double dilution method","text":"the process of separating a part of the diluted exhaust flow and mixing it with an appropriate amount of dilution air prior to the particulate sampling filter.","local":"3.1.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.5","label":"Full flow exhaust dilution system","core":true,"term":"Full flow exhaust dilution system","text":"the continuous dilution of the total vehicle exhaust with ambient air in a controlled manner using a Constant Volume Sampler (CVS).","local":"3.1.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.6","label":"Linearization","core":true,"term":"Linearization","text":"the application of a range of concentrations or materials to establish a mathematical relationship between concentration and system response.","local":"3.1.6","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.7","label":"Major maintenance","core":true,"term":"Major maintenance","text":"the adjustment, repair or replacement of a component or module that could affect the accuracy of a measurement.","local":"3.1.7","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.8","label":"\u00a73.1.8","core":true,"term":null,"text":"\"Non-Methane Hydrocarbons\" (NMHC) are the Total Hydrocarbons (THC) minus the methane (CH4) contribution.","local":"3.1.8","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.1.9","label":"Precision","core":true,"term":"Precision","text":"the degree to which repeated measurements under unchanged conditions show the same results (Figure 1) and, in this Regulation, always refers to one standard deviation.","local":"3.1.9","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10","label":"\u00a73.10","core":true,"term":null,"text":"On-Board Diagnostics (OBD)","local":"3.10","labels":["Subsection","Paragraph"],"degree":25},{"id":"REG154.04.BODY.3.10.1","label":"On-Board Diagnostic (OBD) system","core":true,"term":"On-Board Diagnostic (OBD) system","text":"in context of this Regulation, a system on-board the vehicle which has the capability of detecting malfunctions of the monitored emission control systems, identifying the likely area of a malfunction by means of fault codes stored in computer memory, and illumination of the Malfunction Indicator (MI) to notify the operator of the vehicle.","local":"3.10.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.10","label":"\u00a73.10.10","core":true,"term":null,"text":"A \"Fuel trim\" refers to feedback adjustments to the base fuel schedule. Short- term fuel trim refers to dynamic or instantaneous adjustments. Long-term fuel trim refers to much more gradual adjustments to the fuel calibration schedule than short-term trim adjustments. These long-term adjustments compensate for vehicle differences and gradual changes that occur over time.","local":"3.10.10","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.11","label":"\u00a73.10.11","core":true,"term":null,"text":"A \"Calculated load value\" refers to an indication of the current airflow divided by peak airflow, where peak airflow is corrected for altitude, if available. This definition provides a dimensionless number that is not engine specific and provides the service technician with an indication of the proportion of engine capacity that is being used (with wide open throttle as 100 per cent); \ud835\udc36\ud835\udc3f\ud835\udc49\u2004 = \ud835\udc36\ud835\udc62\ud835\udc5f\ud835\udc5f\ud835\udc52\ud835\udc5b\ud835\udc61\u2004\ud835\udc4e\ud835\udc56\ud835\udc5f\ud835\udc53\ud835\udc59\ud835\udc5c\ud835\udc64 \ud835\udc43\ud835\udc52\ud835\udc4e\ud835\udc58\u2004\ud835\udc4e\ud835\udc56\ud835\udc5f\ud835\udc53\ud835\udc59\ud835\udc5c\ud835\udc64\u2004(\ud835\udc4e\ud835\udc61\u2004\ud835\udc60\ud835\udc52\ud835\udc4e\u2004\ud835\udc59\ud835\udc52\ud835\udc63\ud835\udc52\ud835\udc59) \u00d7 \ud835\udc34\ud835\udc61\ud835\udc5a\ud835\udc5c\ud835\udc60\ud835\udc5d\u210e\ud835\udc52\ud835\udc5f\ud835\udc56\ud835\udc50\u2004\ud835\udc5d\ud835\udc5f\ud835\udc52\ud835\udc60\ud835\udc60\ud835\udc62\ud835\udc5f\ud835\udc52\u2004(\ud835\udc4e\ud835\udc61\u2004\ud835\udc60\ud835\udc52\ud835\udc4e\u2004\ud835\udc59\ud835\udc52\ud835\udc63\ud835\udc52\ud835\udc59) \ud835\udc35\ud835\udc4e\ud835\udc5f\ud835\udc5c\ud835\udc5a\ud835\udc52\ud835\udc61\ud835\udc5f\ud835\udc56\ud835\udc50\u2004\ud835\udc5d\ud835\udc5f\ud835\udc52\ud835\udc60\ud835\udc60\ud835\udc62\ud835\udc5f\ud835\udc52","local":"3.10.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.12","label":"\u00a73.10.12","core":true,"term":null,"text":"\"Permanent emission default mode\" refers to a case where the engine management controller permanently switches to a setting that does not require an input from a failed component or system where such a failed component or system would result in an increase in emissions from the vehicle to a level above the OBD thresholds given in paragraph 6.8.2.","local":"3.10.12","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.10.12.1","label":"\u00a73.10.12.1","core":true,"term":null,"text":"Permanent in this context means that the default mode is not recoverable, i.e. the diagnostic or control strategy that caused the emission default mode cannot run in the next driving cycle and cannot confirm that the conditions that caused the emission default mode is not present anymore. All other emission default modes are considered not to be permanent.","local":"3.10.12.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.13","label":"Power take-off (PTO) unit","core":true,"term":"Power take-off (PTO) unit","text":"an engine-driven output provision for the purposes of powering auxiliary, vehicle mounted, equipment.","local":"3.10.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.14","label":"Access","core":true,"term":"Access","text":"the availability of all emission-related OBD data including all fault codes required for the inspection, diagnosis, servicing or repair of emissions-related parts of the vehicle, via the serial interface for the standard diagnostic connection (pursuant to paragraph 6.5.3.5. of Appendix 1 to Annex C5).","local":"3.10.14","labels":["Provision","Paragraph"],"degree":4},{"id":"REG154.04.BODY.3.10.15","label":"\u00a73.10.15","core":true,"term":null,"text":"\"Unrestricted\" means:","local":"3.10.15","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.10.15.1","label":"\u00a73.10.15.1","core":true,"term":null,"text":"Access not dependent on an access code obtainable only from the manufacturer, or a similar device; or","local":"3.10.15.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.15.2","label":"\u00a73.10.15.2","core":true,"term":null,"text":"Access allowing evaluation of the data produced without the need for any unique decoding information, unless that information itself is standardised.","local":"3.10.15.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.16","label":"Standardised","core":true,"term":"Standardised","text":"that all data stream information, including all fault codes used, shall be produced only in accordance with industry standards which, by virtue of the fact that their format and their permitted options are clearly defined, provide for a maximum level of harmonisation in the motor vehicle industry, and whose use is expressly permitted in this Regulation.","local":"3.10.16","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.17","label":"\u00a73.10.17","core":true,"term":null,"text":"(Reserved)","local":"3.10.17","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.18","label":"\u00a73.10.18","core":true,"term":null,"text":"\"Deficiency\" means, in respect of vehicle OBD systems, that components or systems that are monitored contain temporary or permanent operating characteristics that impair the otherwise efficient OBD monitoring of those components or systems or do not meet all of the other detailed requirements for OBD.","local":"3.10.18","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.19","label":"Limp-home routines","core":true,"term":"Limp-home routines","text":"any default mode other than emission default mode.","local":"3.10.19","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.2","label":"OBD family","core":true,"term":"OBD family","text":"a manufacturer's grouping of vehicles which, through their design, are expected to have similar exhaust emission and OBD system characteristics. Each vehicle of this family shall have complied with the requirements of this Regulation as defined in paragraph 6.8.1.","local":"3.10.2","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.10.20","label":"\u00a73.10.20","core":true,"term":null,"text":"\"Pending fault code\" is a diagnostic trouble code stored upon the initial detection of a malfunction prior to illumination of the malfunction indicator.","local":"3.10.20","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.21","label":"Readiness","core":true,"term":"Readiness","text":"a status indicating whether a monitor or a group of monitors have run since the last erasing by an external request or command (for example through an OBD scan-tool).","local":"3.10.21","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.22","label":"\u00a73.10.22","core":true,"term":null,"text":"\"Confirmed fault code\" is defined as the diagnostic trouble code stored when the OBD system has confirmed that a malfunction exists (e.g., typically on the third driving cycle that the malfunction is detected).","local":"3.10.22","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.23","label":"Cold start","core":true,"term":"Cold start","text":"in the context of In Use Performance Ratio Monitoring (IUPRM), an engine coolant temperature (or equivalent temperature) at engine start of less than or equal to 35 \u00b0C and less than or equal to 7 K higher than ambient temperature (if available) at engine start.","local":"3.10.23","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.24","label":"\u00a73.10.24","core":true,"term":null,"text":"\u201cEmission control components\u201d (also called \u201cemission control system components\u201d, \u201cemission related powertrain components\u201d, \u201c emission control device\u201d, \u201c emission-related component\u201d) means any component of the \u201cemission control system\u201d which has an influence on the emissions for which an OBD thresholds in Table 4A and Table 4B in paragraph 6.8.2. exists.","local":"3.10.24","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.10.3","label":"Emission control system","core":true,"term":"Emission control system","text":"in the context of OBD the electronic engine management controller and any emission-related component in the exhaust or evaporative system which supplies an input to or receives an output from this controller.","local":"3.10.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.4","label":"Malfunction indicator (MI)","core":true,"term":"Malfunction indicator (MI)","text":"a visible or audible indicator that clearly informs the driver of the vehicle in the event of a malfunction of any emission- related component connected to the OBD system, or the OBD system itself.","local":"3.10.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.5","label":"Malfunction","core":true,"term":"Malfunction","text":"the failure of an emission-related component or system that would result in emissions exceeding the OBD thresholds in paragraph 6.8.2. or if the OBD system is unable to fulfil the basic monitoring requirements of Annex C5.","local":"3.10.5","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.10.6","label":"\u00a73.10.6","core":true,"term":null,"text":"\"Secondary air\" refers to air introduced into the exhaust system by means of a pump or aspirator valve or other means that is intended to aid in the oxidation of HC and CO contained in the exhaust gas stream.","local":"3.10.6","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.7","label":"Engine misfire","core":true,"term":"Engine misfire","text":"lack of combustion in the cylinder of a positive ignition engine due to absence of spark, poor fuel metering, poor compression or any other cause. In terms of OBD monitoring it is that percentage of misfires out of a total number of firing events (as declared by the manufacturer) that would result in emissions exceeding the OBD thresholds given in paragraph 6.8.2. or that percentage that could lead to an exhaust catalyst, or catalysts, overheating causing irreversible damage.","local":"3.10.7","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.10.8","label":"\u00a73.10.8","core":true,"term":null,"text":"An \"OBD driving cycle\" consists of key-on, a driving mode where a malfunction would be detected if present, and key-off.","local":"3.10.8","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.10.9","label":"\u00a73.10.9","core":true,"term":null,"text":"A \"warm-up cycle\" means sufficient vehicle operation such that the coolant temperature has risen by at least 22 K from engine starting and reaches a minimum temperature of 343 K (70 \u00b0C).","local":"3.10.9","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.11","label":"\u00a73.11","core":true,"term":null,"text":"Ambient Temperature Correction Test (Annex B6a) This paragraph is applicable to Level 1A and Level 2 only","local":"3.11","labels":["Subsection","Paragraph"],"degree":4},{"id":"REG154.04.BODY.3.11.1","label":"Active heat storage device","core":true,"term":"Active heat storage device","text":"a technology that stores heat within any device of a vehicle and releases the heat to a powertrain component over a defined time period at engine start. It is characterised by the stored enthalpy in the system and the time for heat release to the powertrain components.","local":"3.11.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.11.2","label":"Insulation materials","core":true,"term":"Insulation materials","text":"any material in the engine compartment attached to the engine and/or the chassis with a thermal insulation effect and characterised by a maximum heat conductivity of 0.1 W/(mK).","local":"3.11.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12","label":"\u00a73.12","core":true,"term":null,"text":"Battery Durability (Annex C1)","local":"3.12","labels":["Subsection","Paragraph"],"degree":27},{"id":"REG154.04.BODY.3.12.1","label":"\u00a73.12.1","core":true,"term":null,"text":"\"Battery\" means, a rechargeable electrical energy storage system (REESS) installed in an electrified vehicle and used mainly for traction purposes.","local":"3.12.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.10","label":"State of certified range","core":true,"term":"State of certified range","text":"the measured or on-board electric range at a specific point in its lifetime, expressed as a percentage of the certified range.","local":"3.12.10","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.11","label":"Minimum Performance Requirement","core":true,"term":"Minimum Performance Requirement","text":"the minimum durability performance, in terms of SOCE or SOCR at a specific point in the lifetime of the vehicle, that constitutes compliance with the durability provisions of this Regulation.","local":"3.12.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.12","label":"Declared Performance Requirement","core":true,"term":"Declared Performance Requirement","text":"an SOCE or SOCR value declared by the manufacturer that is greater than that of the corresponding MPR and which then becomes the minimum durability performance that constitutes compliance of that manufacturer with the durability provisions of this Regulation.","local":"3.12.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.13","label":"SOCR monitor","core":true,"term":"SOCR monitor","text":"an apparatus installed in the vehicle that maintains an estimate of the state of certified range by means of an algorithm operating on data collected from the vehicle systems.","local":"3.12.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.14","label":"SOCE monitor","core":true,"term":"SOCE monitor","text":"an apparatus installed in the vehicle that maintains an estimate of the state of certified energy by means of an algorithm operating on data collected from the vehicle systems.","local":"3.12.14","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.15","label":"\u00a73.12.15","core":true,"term":null,"text":"\"On-board SOCR\u201d (SOCRread) means an estimate of state of certified range produced by an SOCR monitor.","local":"3.12.15","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.16","label":"On-board SOCE","core":true,"term":"On-board SOCE","text":"an estimate of state of certified energy produced by an SOCE monitor.","local":"3.12.16","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.17","label":"Measured SOCR","core":true,"term":"Measured SOCR","text":"the state of certified range as determined by the measured range divided by the certified range, according to paragraph 3.1.2. of Annex 5 of UN Regulation No. 83.","local":"3.12.17","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.18","label":"Measured SOCE","core":true,"term":"Measured SOCE","text":"the state of certified energy as determined by the measured usable battery energy divided by the certified usable battery energy.","local":"3.12.18","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.19","label":"V2X","core":true,"term":"V2X","text":"the use of the traction batteries to cover external power and energy demand, such as V2G (Vehicle-to-Grid) for grid stabilization by utilising traction batteries, V2H (Vehicle-to-Home) for utilizing traction batteries as residential storage for local optimisation or emergency power sources in times of power failure, and V2L (Vehicle-to-Load, only connected loads are supplied) for use in times of power failure and/or outdoor activity in normal times.","local":"3.12.19","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.2","label":"Originally installed battery","core":true,"term":"Originally installed battery","text":"the battery that is installed in the vehicle at the time of manufacture, or if the vehicle is manufactured without an installed battery, the battery that is installed in the vehicle when it is first operated on the road.","local":"3.12.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.20","label":"Total discharge energy during V2X","core":true,"term":"Total discharge energy during V2X","text":"the total amount of discharged energy during V2X which needs to be provided according to Appendix 1 to Annex C1 of this Regulation.","local":"3.12.20","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.12.21","label":"Maximum charging power","core":true,"term":"Maximum charging power","text":"the highest available charging power for the considered Part B family, as defined in paragraph 6.11.1.2. of this Regulation.","local":"3.12.21","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.12.22","label":"Energy throughput ","core":true,"term":"Energy throughput ","text":"the total amount of energy in kWh discharged from the battery.","local":"3.12.22","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.23","label":"Total discharge energy for non-...","core":true,"term":"Total discharge energy for non-traction purposes","text":"the total amount of energy in kWh discharged from the battery for purposes other than traction to support the particular use case of a Category N vehicle and do not include air conditioning/heating for the cabin or other uses already present in category M.","local":"3.12.23","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.24","label":"Odometer","core":true,"term":"Odometer","text":"an instrument which indicates to the driver the total distance recorded by the vehicle since its production.","local":"3.12.24","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.25","label":"State of charge (SOC)","core":true,"term":"State of charge (SOC)","text":"the indicated value of the residual capacity in a battery available to be discharged expressed as a percentage and as indicated to the vehicle operator.","local":"3.12.25","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.3","label":"Usable battery energy (UBE)","core":true,"term":"Usable battery energy (UBE)","text":"the energy supplied by the battery from the beginning of the test procedure used for certification until the applicable break-off criterion of the test procedure used for certification is reached.","local":"3.12.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.12.4","label":"\u00a73.12.4","core":true,"term":null,"text":"\"Certified usable battery energy\" (UBEcertified) refers to the UBE that was determined during the certification of the vehicle, according to Appendix 2 to Annex C1 of this Regulation.","local":"3.12.4","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.12.5","label":"Measured usable battery energy","core":true,"term":"Measured usable battery energy","text":"the UBE determined at the present point in the lifetime of the vehicle by the test procedure used for certification, according to Appendix 2 to Annex C1 of this Regulation.","local":"3.12.5","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.12.6","label":"\u00a73.12.6","core":true,"term":null,"text":"\"Electric Range\" in Annex C1 refers to the range that would be determined by the range test procedure used for certification of the vehicle, if the test was performed at the present point in the lifetime of the vehicle and with the originally installed battery.","local":"3.12.6","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.12.7","label":"\u00a73.12.7","core":true,"term":null,"text":"\"Certified range\" (Rangecertified) refers to the electric driving range that was determined during certification of the vehicle, according to Appendix 2 to Annex C1 of this Regulation.","local":"3.12.7","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.12.8","label":"Measured range","core":true,"term":"Measured range","text":"the electric range determined at the present point in the lifetime of the vehicle by the test procedure used for certification, according to Appendix 2 to Annex C1 of this Regulation.","local":"3.12.8","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.12.9","label":"State of certified energy","core":true,"term":"State of certified energy","text":"the durability performance of the battery at a specific point in the lifetime of the vehicle, determined as a measured or estimated usable battery energy divided by the certified usable battery energy, and expressed as a percentage..","local":"3.12.9","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2","label":"\u00a73.2","core":true,"term":null,"text":"Road load and dynamometer setting","local":"3.2","labels":["Subsection","Paragraph"],"degree":38},{"id":"REG154.04.BODY.3.2.1","label":"Aerodynamic drag","core":true,"term":"Aerodynamic drag","text":"the force opposing a vehicle\u2019s forward motion through air.","local":"3.2.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.10","label":"Reference atmospheric condition...","core":true,"term":"Reference atmospheric conditions (regarding road load measurements)","text":"the atmospheric conditions to which these measurement results are corrected: (a) Atmospheric pressure: p0 = 100 kPa; (b) Atmospheric temperature: T0 = 20 \u00b0C; (c) Dry air density: \u03c10 = 1.189 kg/m3; (d) Wind speed: 0 m/s.","local":"3.2.10","labels":["Provision","Paragraph"],"degree":5},{"id":"REG154.04.BODY.3.2.11","label":"Reference speed","core":true,"term":"Reference speed","text":"the vehicle speed at which road load is determined or chassis dynamometer load is verified.","local":"3.2.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.12","label":"Road load","core":true,"term":"Road load","text":"the force resisting the forward motion of a vehicle as measured with the coastdown method or methods that are equivalent regarding the inclusion of frictional losses of the drivetrain.","local":"3.2.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.13","label":"Rolling resistance","core":true,"term":"Rolling resistance","text":"the forces of the tyres opposing the motion of a vehicle.","local":"3.2.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.14","label":"Running resistance","core":true,"term":"Running resistance","text":"the torque resisting the forward motion of a vehicle measured by torque meters installed at the driven wheels of a vehicle.","local":"3.2.14","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.15","label":"Simulated road load","core":true,"term":"Simulated road load","text":"the road load experienced by the vehicle on the chassis dynamometer which is intended to reproduce the road load measured on the road, and consists of the force applied by the chassis dynamometer and the forces resisting the vehicle while driving on the chassis dynamometer and is approximated by the three coefficients of a second order polynomial.","local":"3.2.15","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.16","label":"Simulated running resistance","core":true,"term":"Simulated running resistance","text":"the running resistance experienced by the vehicle on the chassis dynamometer which is intended to reproduce the running resistance measured on the road, and consists of the torque applied by the chassis dynamometer and the torque resisting the vehicle while driving on the chassis dynamometer and is approximated by the three coefficients of a second order polynomial.","local":"3.2.16","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.17","label":"Stationary anemometry","core":true,"term":"Stationary anemometry","text":"measurement of wind speed and direction with an anemometer at a location and height above road level alongside the test road where the most representative wind conditions will be experienced.","local":"3.2.17","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.18","label":"Standard equipment","core":true,"term":"Standard equipment","text":"the basic configuration of a vehicle which is equipped with all the features that are required under the regulatory acts of the Contracting Party including all features that are fitted without giving rise to any further specifications on configuration or equipment level.","local":"3.2.18","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.19","label":"Target road load","core":true,"term":"Target road load","text":"the road load to be reproduced on the chassis dynamometer.","local":"3.2.19","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.2","label":"Aerodynamic stagnation point","core":true,"term":"Aerodynamic stagnation point","text":"the point on the surface of a vehicle where wind velocity is equal to zero.","local":"3.2.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.20","label":"Target running resistance","core":true,"term":"Target running resistance","text":"the running resistance to be reproduced.","local":"3.2.20","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.21","label":"Vehicle coastdown mode","core":true,"term":"Vehicle coastdown mode","text":"a system of operation enabling an accurate and repeatable determination of road load and an accurate dynamometer setting.","local":"3.2.21","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.22","label":"Wind correction","core":true,"term":"Wind correction","text":"correction of the effect of wind on road load based on input of the stationary or on-board anemometry.","local":"3.2.22","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.23","label":"Technically permissible maximum...","core":true,"term":"Technically permissible maximum laden mass","text":"the maximum mass allocated to a vehicle on the basis of its construction features and its design performances.","local":"3.2.23","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.24","label":"Actual mass of the vehicle","core":true,"term":"Actual mass of the vehicle","text":"the mass in running order plus the mass of the fitted optional equipment to an individual vehicle.","local":"3.2.24","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.25","label":"Test mass of the vehicle","core":true,"term":"Test mass of the vehicle","text":"the sum of the actual mass of the vehicle, 25 kg and the mass representative of the vehicle load.","local":"3.2.25","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.2.26","label":"Mass representative of the vehi...","core":true,"term":"Mass representative of the vehicle load","text":"x per cent of the maximum vehicle load where x is 15 per cent for category M vehicles and 28 per cent for category N vehicles.","local":"3.2.26","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.27","label":"Technically permissible maximum...","core":true,"term":"Technically permissible maximum laden mass of the combination","text":"the maximum mass allocated to the combination of a motor vehicle and one or more trailers on the basis of its construction features and its design performances or the maximum mass allocated to the combination of a tractor unit and a semi-trailer.","local":"3.2.27","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.2.28","label":"n/v ratio","core":true,"term":"n/v ratio","text":"the engine rotational speed divided by vehicle speed.","local":"3.2.28","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.29","label":"Single roller dynamometer","core":true,"term":"Single roller dynamometer","text":"a dynamometer where each wheel on a vehicle's axle is in contact with one roller.","local":"3.2.29","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.3","label":"Anemometer blockage","core":true,"term":"Anemometer blockage","text":"the effect on the anemometer measurement due to the presence of the vehicle where the apparent air speed is different than the vehicle speed combined with wind speed relative to the ground.","local":"3.2.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.30","label":"Twin-roller dynamometer","core":true,"term":"Twin-roller dynamometer","text":"a dynamometer where each wheel on a vehicle's axle is in contact with two rollers.","local":"3.2.30","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.31","label":"Powered axle","core":true,"term":"Powered axle","text":"an axle of a vehicle which is able to deliver propulsion energy and/or recuperate energy, independent of whether that is only temporarily or permanently possible and/or selectable by the driver.","local":"3.2.31","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.32","label":"2WD dynamometer","core":true,"term":"2WD dynamometer","text":"a dynamometer where only the wheels on one vehicle axle are in contact with the roller(s).","local":"3.2.32","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.33","label":"4WD dynamometer","core":true,"term":"4WD dynamometer","text":"a dynamometer where all wheels on both vehicle axles are in contact with the rollers.","local":"3.2.33","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.34","label":"Dynamometer in 2WD operation","core":true,"term":"Dynamometer in 2WD operation","text":"a 2WD dynamometer, or a 4WD dynamometer which only simulates inertia and road load on the powered axle of the test vehicle and where the rotating wheels on the non-powered axle shall have no influence on the measurement results compared to a situation where the wheels on the non-powered axle are not rotating.","local":"3.2.34","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.35","label":"Dynamometer in 4WD operation","core":true,"term":"Dynamometer in 4WD operation","text":"a 4WD dynamometer which simulates inertia and road load on both axles of the test vehicle.","local":"3.2.35","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.36","label":"Coasting","core":true,"term":"Coasting","text":"a functionality of either an automatic transmission or a clutch which, when no propulsion or a slow reduction of speed is needed, decouples the engine from the drivetrain automatically and neither a propulsion energy is applied to the wheels nor recuperation energy is taken from the wheels nor friction braking is applied. During application of this function the engine may be idling or switched off.","local":"3.2.36","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.37","label":"Reference mass","core":true,"term":"Reference mass","text":"the vehicle\u2019s mass in running order less the uniform mass of the driver of 75 kg and increased by a uniform mass of 100 kg.","local":"3.2.37","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.4","label":"Constrained analysis","core":true,"term":"Constrained analysis","text":"the vehicle\u2019s frontal area and aerodynamic drag coefficient have been independently determined and those values shall be used in the equation of motion.","local":"3.2.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.5","label":"Mass in running order","core":true,"term":"Mass in running order","text":"the mass of the vehicle, with its fuel tank(s) filled to at least 90 per cent of its or their capacity/capacities, including the mass of the driver, fuel and liquids, fitted with the standard equipment in accordance with the manufacturer\u2019s specifications and, when they are fitted, the mass of the bodywork, the cabin, the coupling and the spare wheel(s) as well as the tools.","local":"3.2.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.6","label":"Mass of the driver","core":true,"term":"Mass of the driver","text":"a mass rated at 75 kg located at the driver\u2019s seating reference point.","local":"3.2.6","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.2.7","label":"Maximum vehicle load","core":true,"term":"Maximum vehicle load","text":"the technically permissible maximum laden mass minus the mass in running order, 25 kg and the mass of the optional equipment as defined in paragraph 3.2.8.","local":"3.2.7","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.2.8","label":"Mass of the optional equipment","core":true,"term":"Mass of the optional equipment","text":"maximum mass of the combinations of optional equipment which may be fitted to the vehicle in addition to the standard equipment in accordance with the manufacturer's specifications.","local":"3.2.8","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.2.9","label":"Optional equipment","core":true,"term":"Optional equipment","text":"all the features not included in the standard equipment which are fitted to a vehicle under the responsibility of the manufacturer, and that can be ordered by the customer.","local":"3.2.9","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3","label":"\u00a73.3","core":true,"term":null,"text":"Pure electric, pure ICE, hybrid electric, fuel cell and alternatively-fuelled vehicles","local":"3.3","labels":["Subsection","Paragraph"],"degree":29},{"id":"REG154.04.BODY.3.3.1","label":"All-Electric Range","core":true,"term":"All-Electric Range","text":"the total distance travelled by an OVC- HEV from the beginning of the charge-depleting test to the point in time during the test when the combustion engine starts to consume fuel.","local":"3.3.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.10","label":"Energy storage system","core":true,"term":"Energy storage system","text":"a system which stores energy and releases it in the same form as was input.","local":"3.3.10","labels":["Provision","Paragraph"],"degree":5},{"id":"REG154.04.BODY.3.3.10.1","label":"Propulsion energy storage system","core":true,"term":"Propulsion energy storage system","text":"an energy storage system of the powertrain which is not a peripheral device and whose output energy is used directly or indirectly for the purpose of vehicle propulsion.","local":"3.3.10.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.10.2","label":"Category of propulsion energy s...","core":true,"term":"Category of propulsion energy storage system","text":"(i) a fuel storage system, or (ii) a rechargeable electric energy storage system, or (iii) a rechargeable mechanical energy storage system.","local":"3.3.10.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.10.3","label":"Form of energy","core":true,"term":"Form of energy","text":"(i) electrical energy, or (ii) mechanical energy, or (iii) chemical energy (including fuels).","local":"3.3.10.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.10.4","label":"Fuel storage system","core":true,"term":"Fuel storage system","text":"a propulsion energy storage system that stores chemical energy as liquid or gaseous fuel.","local":"3.3.10.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.11","label":"Equivalent all-electric range","core":true,"term":"Equivalent all-electric range","text":"that portion of the total charge- depleting actual range (RCDA) attributable to the use of electricity from the REESS over the charge-depleting range test.","local":"3.3.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.12","label":"Hybrid electric vehicle","core":true,"term":"Hybrid electric vehicle","text":"a hybrid vehicle where one of the propulsion energy converters is an electric machine.","local":"3.3.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.13","label":"Hybrid vehicle","core":true,"term":"Hybrid vehicle","text":"a vehicle equipped with a powertrain containing at least two different categories of propulsion energy converters and at least two different categories of propulsion energy storage systems.","local":"3.3.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.14","label":"Net energy change","core":true,"term":"Net energy change","text":"the ratio of the REESS energy change divided by the cycle energy demand of the test vehicle.","local":"3.3.14","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.15","label":"Not off-vehicle charging hybrid...","core":true,"term":"Not off-vehicle charging hybrid electric vehicle","text":"a hybrid electric vehicle that cannot be charged from an external source.","local":"3.3.15","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.16","label":"Off-vehicle charging hybrid ele...","core":true,"term":"Off-vehicle charging hybrid electric vehicle","text":"a hybrid electric vehicle that can be charged from an external source.","local":"3.3.16","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.17","label":"Pure electric vehicle","core":true,"term":"Pure electric vehicle","text":"a vehicle equipped with a powertrain containing exclusively electric machines as propulsion energy converters and exclusively rechargeable electric energy storage systems as propulsion energy storage systems.","local":"3.3.17","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.18","label":"Fuel cell","core":true,"term":"Fuel cell","text":"an energy converter transforming chemical energy (input) into electrical energy (output) or vice versa.","local":"3.3.18","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.19","label":"Fuel cell vehicle","core":true,"term":"Fuel cell vehicle","text":"a vehicle equipped with a powertrain containing exclusively fuel cell(s) and electric machine(s) as propulsion energy converter(s).","local":"3.3.19","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.2","label":"Pure Electric Range","core":true,"term":"Pure Electric Range","text":"the total distance travelled by a PEV from the beginning of the charge-depleting test until the break-off criterion is reached.","local":"3.3.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.20","label":"Fuel cell hybrid vehicle","core":true,"term":"Fuel cell hybrid vehicle","text":"a fuel cell vehicle equipped with a powertrain containing at least one fuel storage system and at least one rechargeable electric energy storage system as propulsion energy storage systems.","local":"3.3.20","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.3.20.1","label":"Not off-vehicle charging fuel c...","core":true,"term":"Not off-vehicle charging fuel cell hybrid electric vehicle","text":"a fuel cell hybrid electric vehicle that cannot be charged from an external source.","local":"3.3.20.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.20.2","label":"Off-vehicle charging fuel cell ...","core":true,"term":"Off-vehicle charging fuel cell hybrid electric vehicle","text":"a fuel cell hybrid electric vehicle that can be charged from an external source.","local":"3.3.20.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.21","label":"Bi-fuel vehicle","core":true,"term":"Bi-fuel vehicle","text":"a vehicle with two separate fuel storage systems that is designed to run primarily on only one fuel at a time; however, the simultaneous use of both fuels is permitted in limited amount and duration.","local":"3.3.21","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.22","label":"Bi-fuel gas vehicle","core":true,"term":"Bi-fuel gas vehicle","text":"a bi-fuel vehicle where the two fuels are petrol (petrol mode) and either LPG, NG/biomethane, or hydrogen.","local":"3.3.22","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.23","label":"Pure ICE vehicle","core":true,"term":"Pure ICE vehicle","text":"a vehicle where all of the propulsion energy converters are internal combustion engines.","local":"3.3.23","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.24","label":"On-board charger","core":true,"term":"On-board charger","text":"the electric power converter between the traction REESS and the vehicle's recharging socket.","local":"3.3.24","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.25","label":"Flex fuel vehicle","core":true,"term":"Flex fuel vehicle","text":"a vehicle with one fuel storage system that can run on different mixtures of two or more fuels.","local":"3.3.25","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.26","label":"Flex fuel ethanol vehicle","core":true,"term":"Flex fuel ethanol vehicle","text":"a flex fuel vehicle that can run on petrol or a mixture of petrol and ethanol up to an 85 per cent ethanol blend (E85).","local":"3.3.26","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.27","label":"Mono-fuel vehicle","core":true,"term":"Mono-fuel vehicle","text":"a vehicle that is designed to run primarily on one type of fuel.","local":"3.3.27","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.28","label":"Mono-fuel gas vehicle","core":true,"term":"Mono-fuel gas vehicle","text":"a mono-fuel vehicle that is designed primarily for permanent running on LPG or NG/biomethane or hydrogen, but may also have a petrol system for emergency purposes or starting only, where the nominal capacity of the petrol tank does not exceed 15 litres.","local":"3.3.28","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.3","label":"Charge-Depleting Actual Range","core":true,"term":"Charge-Depleting Actual Range","text":"the distance travelled in a series of WLTCs in charge-depleting operating condition until the Rechargeable Electric Energy Storage System (REESS) is depleted.","local":"3.3.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.4","label":"Charge-Depleting Cycle Range","core":true,"term":"Charge-Depleting Cycle Range","text":"the distance from the beginning of the charge-depleting test to the end of the last cycle prior to the cycle or cycles satisfying the break-off criterion, including the transition cycle where the vehicle may have operated in both depleting and sustaining conditions.","local":"3.3.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.5","label":"Charge-depleting operating cond...","core":true,"term":"Charge-depleting operating condition","text":"an operating condition in which the energy stored in the REESS may fluctuate but decreases on average while the vehicle is driven until transition to charge-sustaining operation.","local":"3.3.5","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.3.6","label":"Charge-sustaining operating con...","core":true,"term":"Charge-sustaining operating condition","text":"an operating condition in which the energy stored in the REESS may fluctuate but, on average, is maintained at a neutral charging balance level while the vehicle is driven.","local":"3.3.6","labels":["Provision","Paragraph"],"degree":5},{"id":"REG154.04.BODY.3.3.7","label":"\u00a73.3.7","core":true,"term":null,"text":"\"Utility Factors\" are ratios based on driving statistics depending on the range achieved in charge-depleting condition and are used to weigh the charge- depleting and charge-sustaining exhaust emission compounds, CO2 emissions and fuel consumption for OVC-HEVs.","local":"3.3.7","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.8","label":"Electric machine","core":true,"term":"Electric machine","text":"an energy converter transforming between electrical and mechanical energy.","local":"3.3.8","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.9","label":"Energy converter","core":true,"term":"Energy converter","text":"a system where the form of energy output is different from the form of energy input.","local":"3.3.9","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.3.9.1","label":"Propulsion energy converter","core":true,"term":"Propulsion energy converter","text":"an energy converter of the powertrain which is not a peripheral device whose output energy is used directly or indirectly for the purpose of vehicle propulsion.","local":"3.3.9.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.3.9.2","label":"Category of propulsion energy c...","core":true,"term":"Category of propulsion energy converter","text":"(i) an internal combustion engine, or (ii) an electric machine, or (iii) a fuel cell.","local":"3.3.9.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.4","label":"\u00a73.4","core":true,"term":null,"text":"Powertrain","local":"3.4","labels":["Subsection","Paragraph"],"degree":6},{"id":"REG154.04.BODY.3.4.1","label":"Powertrain","core":true,"term":"Powertrain","text":"the total combination in a vehicle of propulsion energy storage system(s), propulsion energy converter(s) and the drivetrain(s) providing the mechanical energy at the wheels for the purpose of vehicle propulsion, plus peripheral devices.","local":"3.4.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.4.2","label":"Auxiliary devices","core":true,"term":"Auxiliary devices","text":"energy consuming, converting, storing or supplying non-peripheral devices or systems which are installed in the vehicle for purposes other than the propulsion of the vehicle and are therefore not considered to be part of the powertrain.","local":"3.4.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.4.3","label":"Peripheral devices","core":true,"term":"Peripheral devices","text":"any energy consuming, converting, storing or supplying devices, where the energy is not directly or indirectly used for the purpose of vehicle propulsion but which are essential to the operation of the powertrain and are therefore considered to be part of the powertrain.","local":"3.4.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.4.4","label":"Drivetrain","core":true,"term":"Drivetrain","text":"the connected elements of the powertrain for transmission of the mechanical energy between the propulsion energy converter(s) and the wheels.","local":"3.4.4","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.4.5","label":"Manual transmission","core":true,"term":"Manual transmission","text":"a transmission where gears can only be shifted by action of the driver.","local":"3.4.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5","label":"\u00a73.5","core":true,"term":null,"text":"General","local":"3.5","labels":["Subsection","Paragraph"],"degree":13},{"id":"REG154.04.BODY.3.5.1","label":"Criteria emissions","core":true,"term":"Criteria emissions","text":"those emission compounds for which limits are set in this Regulation.","local":"3.5.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.10","label":"Reference conditions (with rega...","core":true,"term":"Reference conditions (with regards to calculating mass emissions)","text":"the conditions upon which gas densities are based, namely 101.325 kPa and 273.15 K (0 \u00b0C).","local":"3.5.10","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.11","label":"Exhaust emissions","core":true,"term":"Exhaust emissions","text":"the emission of gaseous, solid and liquid compounds from the tailpipe.","local":"3.5.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.12","label":"\u00a73.5.12","core":true,"term":null,"text":"\"Configurable start mode\" for the purpose of this Regulation means a driver- selectable mode that can be set by the driver as a mode which is automatically selected when the vehicle is switched on. After the vehicle is switched on, the configurable start mode can only be switched to another mode by an intentional action of the driver.","local":"3.5.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.2","label":"\u00a73.5.2","core":true,"term":null,"text":"(Reserved)","local":"3.5.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.3","label":"\u00a73.5.3","core":true,"term":null,"text":"(Reserved)","local":"3.5.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.4","label":"\u00a73.5.4","core":true,"term":null,"text":"(Reserved)","local":"3.5.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.5","label":"Cycle energy demand REESS (CEDR...","core":true,"term":"Cycle energy demand REESS (CEDREESS)","text":"the calculated positive and negative energy required by the vehicle REESS to drive the prescribed cycle.","local":"3.5.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.6","label":"Cycle energy demand","core":true,"term":"Cycle energy demand","text":"the calculated positive energy required by the vehicle to drive the prescribed cycle.","local":"3.5.6","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.7","label":"\u00a73.5.7","core":true,"term":null,"text":"This paragraph is applicable to Level 1B and Level 2 only \"Defeat device\" means any element of design which senses temperature, vehicle speed, engine speed (RPM), transmission gear, manifold vacuum or any other parameter for the purpose of activating, modulating, delaying or deactivating the operation of any part of the emission control system, that reduces the effectiveness of the emission control system under conditions which may reasonably be expected to be encountered in normal vehicle operation and use.","local":"3.5.7","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.8","label":"Driver-selectable mode","core":true,"term":"Driver-selectable mode","text":"a distinct driver-selectable condition which could affect emissions, or fuel and/or energy consumption.","local":"3.5.8","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.5.9","label":"\u00a73.5.9","core":true,"term":null,"text":"\"Predominant mode\" for the purpose of this Regulation means a single driver- selectable mode that is always selected when the vehicle is switched on, regardless of the driver-selectable mode in operation when the vehicle was previously shut down, and which cannot be redefined to another mode. After the vehicle is switched on, the predominant mode can only be switched to another driver-selectable mode by an intentional action of the driver.","local":"3.5.9","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.6","label":"\u00a73.6","core":true,"term":null,"text":"PM/PN The term \"particle\" is conventionally used for the matter being characterised (measured) in the airborne phase (suspended matter), and the term \"particulate\" for the deposited matter.","local":"3.6","labels":["Subsection","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.6.1","label":"Particle number emissions","core":true,"term":"Particle number emissions","text":"the total number of solid particles emitted from the vehicle exhaust quantified according to the dilution, sampling and measurement methods as specified in this Regulation.","local":"3.6.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.6.2","label":"Particulate matter emissions","core":true,"term":"Particulate matter emissions","text":"the mass of any particulate material from the vehicle exhaust quantified according to the dilution, sampling and measurement methods as specified in this Regulation.","local":"3.6.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.7","label":"\u00a73.7","core":true,"term":null,"text":"WLTC","local":"3.7","labels":["Subsection","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.7.1","label":"Rated engine power","core":true,"term":"Rated engine power","text":"maximum net power of the engine or motor in kW as per the requirements of UN Regulation No. 85 or system power as per the requirement of UN Regulation No. 177 if applicable.","local":"3.7.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.7.2","label":"Maximum speed","core":true,"term":"Maximum speed","text":"the maximum speed of a vehicle as declared by the manufacturer. In the absence of a declaration, the maximum speed shall be determined according to UN Regulation No. 68.","local":"3.7.2","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.8","label":"\u00a73.8","core":true,"term":null,"text":"Procedure","local":"3.8","labels":["Subsection","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.8.1","label":"Periodically regenerating system","core":true,"term":"Periodically regenerating system","text":"an exhaust emissions control device (e.g. catalytic converter, particulate trap) that requires a periodical regeneration.","local":"3.8.1","labels":["Provision","Paragraph"],"degree":3},{"id":"REG154.04.BODY.3.9","label":"\u00a73.9","core":true,"term":null,"text":"Evaporative emissions","local":"3.9","labels":["Subsection","Paragraph"],"degree":14},{"id":"REG154.04.BODY.3.9.1","label":"Fuel tank system","core":true,"term":"Fuel tank system","text":"the devices which allow storing the fuel, comprising the fuel tank, the fuel filler, the filler cap and the fuel pump when it is fitted in or on the fuel tank.","local":"3.9.1","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.10","label":"Depressurisation puff loss","core":true,"term":"Depressurisation puff loss","text":"hydrocarbons venting from a sealed fuel tank system pressure relief exclusively through the carbon canister allowed by the system.","local":"3.9.10","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.11","label":"\u00a73.9.11","core":true,"term":null,"text":"\"Depressurisation puff loss overflow\" are the depressurisation puff loss hydrocarbons that pass through the carbon canister during depressurisation.","local":"3.9.11","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.12","label":"\u00a73.9.12","core":true,"term":null,"text":"\"Fuel tank relief pressure\" is the minimum pressure value at which the sealed fuel tank system starts venting in response only to pressure inside the tank.","local":"3.9.12","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.13","label":"\u00a73.9.13","core":true,"term":null,"text":"\"2 gram breakthrough\" shall be considered accomplished when the cumulative quantity of hydrocarbons emitted from the activated carbon canister equals 2 grams.","local":"3.9.13","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.2","label":"Fuel system","core":true,"term":"Fuel system","text":"the components which store or transport fuel on board the vehicle and comprise the fuel tank system, all fuel and vapour lines, any non-tank mounted fuel pumps and the activated carbon canister.","local":"3.9.2","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.3","label":"Butane working capacity","core":true,"term":"Butane working capacity","text":"the mass of butane which a carbon canister can adsorb.","local":"3.9.3","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.4","label":"BWC300","core":true,"term":"BWC300","text":"the butane working capacity after 300 cycles of fuel ageing cycles experienced.","local":"3.9.4","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.5","label":"Permeability Factor","core":true,"term":"Permeability Factor","text":"the factor determined from hydrocarbon losses over a period of time and used to determine the final evaporative emissions.","local":"3.9.5","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.6","label":"Monolayer non-metal tank","core":true,"term":"Monolayer non-metal tank","text":"a fuel tank constructed with a single layer of non-metal material including fluorinated/sulfonated materials.","local":"3.9.6","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.7","label":"Multilayer tank","core":true,"term":"Multilayer tank","text":"a fuel tank constructed with at least two different layered materials, one of which is a hydrocarbon barrier material.","local":"3.9.7","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BODY.3.9.8","label":"Sealed fuel tank system","core":true,"term":"Sealed fuel tank system","text":"a fuel tank system where the fuel vapours do not vent during parking over the 24-hour diurnal cycle defined in paragraph 6.5.9. of Annex C3 when performed with the applicable reference fuel defined in paragraph 7 of Annex B3.","local":"3.9.8","labels":["Provision","Paragraph"],"degree":2},{"id":"REG154.04.BODY.3.9.9","label":"Evaporative emissions","core":true,"term":"Evaporative emissions","text":"in the context of this Regulation the hydrocarbon vapours lost from the fuel system of a motor vehicle during parking and immediately before refuelling of a sealed fuel tank.","local":"3.9.9","labels":["Provision","Paragraph"],"degree":1},{"id":"REG154.04.BOD
