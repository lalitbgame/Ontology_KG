# Document registry (plan.md §2.1).
#
# One entry per PDF in Document/. `doc_id` is the id namespace for every node
# of that document's graph; `profile` names pipeline/profiles/<profile>.yaml;
# `self_ids` are the canonical external-document ids under which OTHER
# documents would cite this one - a citation of a self id is treated as an
# internal reference, never as an ExternalDocument node (plan.md §9a.2 step 3).
#
# A PDF without an entry is still processed: its profile is auto-detected and
# a doc_id derived from metadata, flagged `registry_confirmed: false` in its
# manifest until someone adds it here.

documents:
  - file: "154-04 without 1C 1.pdf"
    doc_id: REG154.04
    profile: unece_regulation
    self_ids: [EXT:UNR-154, EXT:ECE.TRANS.WP29.GRPE.2025.15]
    metadata:
      title: "UN Regulation No. 154 (WLTP), 04 series of amendments (GRPE working document)"
      number: "154"
